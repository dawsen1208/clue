name: Check and deploy Clue
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: clue-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for GitHub Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_ENDPOINT: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          for attempt in {1..8}; do
            if gh api "$ARTIFACTS_ENDPOINT" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded GitHub Pages artifact did not become available."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
